# Baseline configuration showing every section. Milestone-specific configs override it.
# Values mirror the model and training defaults; they are starting points,
# not tuned results.
name: default

runtime:
  device: auto          # auto | cpu | mps | cuda
  seed: 1337
  num_workers: 4
  log_level: INFO

data:
  dataset: synthetic    # synthetic | cvl | iam
  manifest: null
  image_height: 64
  max_width: 1600       # oversized lines are flagged, never horizontally crushed
  width_multiple: 16

  # Pixel normalization. Fixed constants, never per-image statistics: per-image
  # standardisation would erase the ink-density differences that ARE writer identity.
  # mean 0 / std 1 is plain [0,1] scaling — a placeholder until IAM stats land.
  invert_pixels: true   # paper -> 0, ink -> 1, so padding matches conv zero-padding
  pixel_mean: 0.0
  pixel_std: 1.0

  # Training augmentation. Every family toggles independently for ablation.
  # Flips and aggressive crops are deliberately not expressible.
  augmentation:
    enabled: true

    # Geometric families are composed into ONE affine op, so enabling several costs
    # a single resampling rather than one per family.
    rotation: true
    rotation_degrees: 1.0      # low on purpose: a wide line rotated about its centre
                               # displaces its ends by (W/2)*tan(theta) — 2 deg on a
                               # 1200px line moves them ~21px on a 64px-tall image
    translate: true
    translate_fraction: 0.02
    scale: true
    scale_min: 0.96
    scale_max: 1.04
    shear: true
    shear_degrees: 4.0         # the safe way to vary slant on a long line
    affine_probability: 0.7

    brightness: true
    brightness_strength: 0.2
    contrast: true
    contrast_strength: 0.2
    photometric_probability: 0.5

    blur: true
    blur_sigma_max: 0.8
    blur_probability: 0.15

    perspective: true
    perspective_scale: 0.05
    perspective_probability: 0.15

    elastic: false             # off by default: most likely family to distort glyph identity
    elastic_alpha: 12.0
    elastic_probability: 0.05

model:
  name: gm_base
  input_height: 64
  visual_dim: 192
  gru_hidden: 192
  gru_layers: 2
  gru_dropout: 0.15
  head_dropout: 0.1
  max_parameters: 3000000

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  min_learning_rate: 0.000001
  grad_clip_norm: 5.0
  amp: false

evaluation:
  decoder: greedy       # greedy is the deployment baseline; no language model, ever
  beam_width: null
  report_wer: true

memory:
  enabled: false        # writer memory is enabled separately
  feature_layer: sequence
  alpha: 0.5
  gate_by_emission: true
  protect_blank: true
  pooling: posterior_weighted
